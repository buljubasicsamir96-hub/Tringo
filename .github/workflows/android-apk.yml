name: Build Tringo Android APK - Build42

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - Tringo2

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify the exact Android source files
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/assets/Tringo.html
          test -f app/src/main/java/ba/tring/tringo/MainActivity.java
          test -f app/build.gradle

          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile

          html_path = Path("app/src/main/assets/Tringo.html")
          html = html_path.read_text(encoding="utf-8")
          java = Path("app/src/main/java/ba/tring/tringo/MainActivity.java").read_text(encoding="utf-8")
          gradle = Path("app/build.gradle").read_text(encoding="utf-8")

          required = [
              '<h1 class="splash-welcome">DOBRODOŠLI</h1>',
              'creator-inline">Kreirao: Samir Buljubašić</span>',
              'class="search-guide"',
              'tringo-build39-splash-init',
              'id="tringoMascotAsset"',
              'data:image/png;base64,',
              'viewport-fit=cover',
              'tringoRunManualSearch',
          ]
          for token in required:
              assert token in html, f"Build42 HTML element missing: {token}"

          for token in [
              'class="smartbar"',
              'class="suggestions"',
              'data-q=',
          ]:
              assert token not in html, f"Old search UI still found: {token}"

          nav_marker = '<nav aria-label="Glavni meni" class="mobile-bottom-nav">'
          assert nav_marker in html, "Mobile bottom navigation missing"
          nav = html.split(nav_marker, 1)[1].split("</nav>", 1)[0]
          assert nav.count("<button") == 5, "Expected exactly five mobile navigation buttons"

          for token in [
              "WindowInsetsCompat.Type.statusBars()",
              "WindowInsetsCompat.Type.navigationBars()",
              "WindowInsetsCompat.Type.displayCutout()",
              "WindowInsetsCompat.Type.ime()",
              "Math.max(safe.bottom, ime.bottom)",
          ]:
              assert token in java, f"Android safe-area handling missing: {token}"

          assert "versionCode 28" in gradle, "Unexpected Android versionCode"
          assert "versionName '1.0.1'" in gradle, "Unexpected Android versionName"

          scripts = re.findall(r'<script\b[^>]*>([\s\S]*?)</script\s*>', html, re.I)
          assert scripts, "No inline JavaScript blocks found"
          for i, script in enumerate(scripts, 1):
              with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8", delete=False) as f:
                  f.write(script)
                  name = f.name
              subprocess.run(["node", "--check", name], check=True)

          print(f"Build42 source checks passed. HTML size: {html_path.stat().st_size} bytes; JS blocks: {len(scripts)}")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Clean and build APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify packaged APK contains the exact Build42 HTML
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          python3 - "$APK" <<'PY'
          import hashlib, sys, zipfile
          from pathlib import Path

          apk = Path(sys.argv[1])
          source = Path("app/src/main/assets/Tringo.html").read_bytes()
          with zipfile.ZipFile(apk) as z:
              names = z.namelist()
              candidates = [n for n in names if n.endswith("assets/Tringo.html")]
              assert candidates, "Tringo.html is not packaged inside the APK"
              packaged = z.read(candidates[0])
          source_hash = hashlib.sha256(source).hexdigest()
          apk_hash = hashlib.sha256(packaged).hexdigest()
          assert source_hash == apk_hash, "APK contains a different/old Tringo.html asset"
          print("APK asset verification PASSED")
          print("Source SHA256:", source_hash)
          print("APK asset SHA256:", apk_hash)
          print("APK file:", apk)
          print("APK size:", apk.stat().st_size)
          PY
          sha256sum "$APK"

      - name: Upload Build42 APK
        uses: actions/upload-artifact@v4
        with:
          name: Tringo-Android-V1.0.1-Build42
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

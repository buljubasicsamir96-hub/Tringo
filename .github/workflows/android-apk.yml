name: Build Tringo Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Build42 HTML, search UI and Android safe area
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile

          html_path = Path("app/src/main/assets/Tringo.html")
          html = html_path.read_text(encoding="utf-8")
          java = Path("app/src/main/java/ba/tring/tringo/MainActivity.java").read_text(encoding="utf-8")
          gradle = Path("app/build.gradle").read_text(encoding="utf-8")

          required = [
              '<h1 class="splash-welcome">DOBRODOŠLI</h1>',
              'creator-inline">Kreirao: Samir Buljubašić</span>',
              'class="search-guide"',
              'tringo-build39-splash-init',
              'id="tringoMascotAsset"',
              'data:image/png;base64,',
              'viewport-fit=cover',
              'tringoRunManualSearch',
          ]
          for item in required:
              assert item in html, f"Missing Build42 requirement: {item}"

          assert 'class="smartbar"' not in html, "Old search filter toolbar is still present"
          assert 'class="suggestions"' not in html, "Preset example chips are still present"
          assert 'data-q=' not in html, "Preset query chips are still present"

          nav_marker = '<nav aria-label="Glavni meni" class="mobile-bottom-nav">'
          assert nav_marker in html, "Mobile navigation is missing"
          nav = html.split(nav_marker, 1)[1].split('</nav>', 1)[0]
          assert nav.count('<button') == 5, "Expected exactly 5 mobile navigation items"

          for token in [
              'WindowInsetsCompat.Type.statusBars()',
              'WindowInsetsCompat.Type.navigationBars()',
              'WindowInsetsCompat.Type.displayCutout()',
              'WindowInsetsCompat.Type.ime()',
              'Math.max(safe.bottom, ime.bottom)',
          ]:
              assert token in java, f"Missing WindowInsets handling: {token}"

          assert "versionCode 28" in gradle
          assert "versionName '1.0.1'" in gradle

          scripts = re.findall(r'<script\b[^>]*>([\s\S]*?)</script\s*>', html, re.I)
          assert scripts, "No JavaScript blocks found"
          for i, script in enumerate(scripts, 1):
              with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8", delete=False) as f:
                  f.write(script)
                  name = f.name
              subprocess.run(["node", "--check", name], check=True)
          print(f"Build42 verification passed: {len(scripts)} JavaScript blocks.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK exists
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload Build42 APK
        uses: actions/upload-artifact@v4
        with:
          name: Tringo-Android-APK-V1.0.1-Build42
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

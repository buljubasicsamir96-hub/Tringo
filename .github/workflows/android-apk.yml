name: Build Tringo Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify approved mobile interface and Android integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("app/src/main/assets/Tringo.html").read_text(encoding="utf-8")
          java = Path("app/src/main/java/ba/tring/tringo/MainActivity.java").read_text(encoding="utf-8")
          assert 'function tringoRunManualSearch(event)' in html
          assert 'tringoSendButton?.addEventListener("click",tringoRunManualSearch,true)' in html
          assert 'tringoSearchForm.addEventListener("submit",tringoRunManualSearch,true)' in html
          assert 'WindowInsetsCompat.Type.systemBars()' in java
          assert 'ViewCompat.requestApplyInsets(webView)' in java
          print("Approved v9 interface, manual search handlers and safe-area integration verified.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK output
        run: |
          test -n "$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          ls -lh app/build/outputs/apk/debug/*.apk
          sha256sum app/build/outputs/apk/debug/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tringo-Android-APK-V1.0.1-Build30
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
